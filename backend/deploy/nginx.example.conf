# Mẫu một proxy TLS trên cùng máy với Kestrel, không tự cài đặt.
# Thay domain và đường dẫn chứng chỉ trước khi kiểm tra bằng nginx -t.
upstream hpuni_backend {
    server 127.0.0.1:5080;
}
server {
    listen 80;
    server_name example.invalid;
    return 301 https://example.invalid$request_uri;
}
server {
    listen 443 ssl;
    server_name example.invalid;
    ssl_certificate /etc/ssl/example.invalid/fullchain.pem;
    ssl_certificate_key /etc/ssl/example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 3m;
    # Kestrel phục vụ đúng allowlist frontend, không expose thư mục workspace.
    location / {
        proxy_pass http://hpuni_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
